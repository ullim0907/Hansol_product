<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한솔대전 생산관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'Noto Sans KR', system-ui, sans-serif; background: #f6f7f8; color: #1c2024; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }
  table { border-collapse: collapse; table-layout: fixed; }
  .cell { border: 1px solid #d7dbe0; padding: 4.75px 7.6px; font-size: 11px; font-weight: 400; white-space: nowrap; background: #fff; overflow: hidden; text-overflow: ellipsis; }
  .hcell { border: 1px solid #c3c8d0; padding: 5px 8px; font-size: 11px; font-weight: 400; color: #3a3f47; background: #eef1f5; white-space: nowrap; position: sticky; top: 0; z-index: 3; }
  .grpcell { border: 1px solid #c3c8d0; padding: 4px 8px; font-size: 11px; font-weight: 400; text-align: center; white-space: nowrap; position: sticky; top: 0; z-index: 3; }
  .num { text-align: right; }
  .frozen { position: sticky; left: 0; z-index: 2; }
  thead .frozen { z-index: 5; }
  .relhdr { /* positioning context for the resizer handle is already provided by .hcell's position:sticky */ }
  .resizer { position: absolute; right: 0; top: 0; width: 6px; height: 100%; cursor: col-resize; z-index: 6; }
  .resizer:hover { background: #1f6feb55; }
  .filterIcon { font-size: 9px; color: #6b7280; margin-left: 4px; cursor: pointer; user-select: none; }
  .filterIcon:hover { color: #1f6feb; }
  .inp { border: 1px solid #d7dbe0; border-radius: 5px; padding: 5px 8px; font-size: 12px; font-family: inherit; width: 100%; background: #fff; }
  .btn { border: none; border-radius: 7px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-accent { background: #1f6feb; color: #fff; }
  .btn-outline { background: #fff; border: 1px solid #d7dbe0; color: #3a3f47; }
  .hidden { display: none !important; }
  #loginScreen { height: 100%; display: flex; align-items: center; justify-content: center; }
  #loginBox { background: #fff; border: 1px solid #e7e9ec; border-radius: 14px; padding: 32px; width: 340px; }
  #app { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
  #navBar { display: flex; align-items: center; gap: 6px; padding: 10px 24px; background: #fbfbfc; border-bottom: 1px solid #eceef1; flex-shrink: 0; overflow-x: auto; }
  .navpill { display: flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; background: #fff; border: 1px solid #e7e9ec; color: #3a3f47; }
  .navpill.active { border-color: #1f6feb; box-shadow: 0 0 0 1px #1f6feb inset; color: #1f6feb; }
  .navpill .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .navpill .navstatus { font-size: 10px; font-weight: 700; color: #8a8f98; }
  .navpill.addpill { color: #9aa1ab; font-weight: 700; border-style: dashed; }
  #tablecontainer { flex: 1; overflow: auto; padding: 0 24px 14px; }
  #tablecontainer > div:first-child { padding-top: 14px; }
  #tablecontainer table { margin-top: 14px; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #1c2024; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 999; }
  #filterPopup label { cursor: pointer; }
</style>
</head>
<body>

<div id="loginScreen">
  <div id="loginBox">
    <div style="font-size:16px; font-weight:700; margin-bottom:4px;">한솔대전 생산관리</div>
    <div style="font-size:12px; color:#8a8f98; margin-bottom:20px;">더울림코퍼레이션 · 담당자 로그인</div>
    <label style="font-size:12px; color:#6b7280; font-weight:600;">담당자</label>
    <select id="loginStaff" class="inp" style="margin:6px 0 12px;"></select>
    <label style="font-size:12px; color:#6b7280; font-weight:600;">비밀번호(PIN)</label>
    <input id="loginPin" class="inp" type="password" inputmode="numeric" style="margin:6px 0 16px;" placeholder="****">
    <button id="loginBtn" class="btn btn-accent" style="width:100%; padding:10px;">로그인</button>
    <div id="loginError" style="color:#c53030; font-size:12px; margin-top:10px;"></div>
    <div style="font-size:11px; color:#b6bac1; margin-top:16px;">최초 비밀번호는 관리자에게 문의하세요.</div>
  </div>
</div>

<div id="app">
  <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 24px; background:#ffffff; border-bottom:1px solid #e7e9ec; flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:30px; height:30px; border-radius:7px; background:#1f6feb; display:flex; align-items:center; justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      </div>
      <div>
        <div style="font-size:15px; font-weight:700;">한솔대전 생산관리</div>
        <div id="subtitle" style="font-size:11px; color:#8a8f98;">더울림코퍼레이션</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="whoami" style="font-size:12px; color:#3a3f47; font-weight:600;"></span>
      <button id="logoutBtn" class="btn btn-outline">로그아웃</button>
    </div>
  </div>

  <div id="navBar"></div>

  <div id="allTopBar" style="display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:10px 24px; background:#fbfbfc; border-bottom:1px solid #eceef1; flex-shrink:0;">
    <input type="file" id="confirmFileInput" accept=".xlsx,.xls" multiple style="display:none;">
    <button id="uploadConfirmBtn" class="btn btn-outline">확정파일 업로드 (다중)</button>
    <button id="closeCycleBtn" class="btn btn-accent">🔒 이번 차수 마감</button>
  </div>

  <div style="display:flex; align-items:center; gap:10px; padding:10px 24px; background:#fff; border-bottom:1px solid #eceef1; flex-shrink:0; flex-wrap:wrap;">
    <input id="searchBox" class="inp" style="width:260px;" placeholder="검색: 지종·평량·가로x세로·포장·고객사·구분·비고 등 (예: 더블랑)">
    <label style="display:flex; align-items:center; gap:5px; font-size:11px; color:#6b7280;">
      <input type="checkbox" id="hideWeightChk"> 중량 숨기기
    </label>
    <span id="startCycleWrap" style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:11px; color:#8a8f98;">시작 차수</span>
      <input id="startCycleInput" class="inp" style="width:110px;" placeholder="예: 26-8-3">
      <button id="startCycleApply" class="btn btn-outline">검색</button>
      <button id="startCycleReset" class="btn btn-outline">최근 5개</button>
    </span>
    <div style="flex:1;"></div>
    <div id="rowCount" style="font-size:11px; color:#8a8f98;"></div>
  </div>

  <div id="newItemPanel" style="padding:12px 24px; background:#fbfbfc; border-bottom:1px solid #eceef1; flex-shrink:0; display:none;">
    <div style="font-size:11px; font-weight:700; color:#8a8f98; margin-bottom:6px;">신규 품목 추가</div>
    <div style="display:grid; grid-template-columns: 80px 120px 100px 70px 60px 60px 100px 1fr 70px 70px; gap:6px; align-items:center;">
      <input id="ni-gubun" class="inp" placeholder="구분">
      <input id="ni-customer" class="inp" placeholder="고객사">
      <input id="ni-jong" class="inp" placeholder="지종">
      <input id="ni-pyeong" class="inp" type="number" placeholder="평량">
      <input id="ni-garo" class="inp" type="number" placeholder="가로">
      <input id="ni-sero" class="inp" type="number" placeholder="세로">
      <select id="ni-pack" class="inp"><option value="">포장</option><option>Roll</option><option>Skid</option><option>Ream</option></select>
      <input id="ni-note" class="inp" placeholder="비고">
      <input id="ni-demand" class="inp" type="number" placeholder="수요">
      <button id="addItemBtn" class="btn btn-accent">등록</button>
    </div>
  </div>

  <div id="tablecontainer"></div>
</div>

<div id="addStaffModalBg" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center; z-index:100;">
  <div style="background:#fff; border-radius:12px; padding:24px; width:320px;">
    <div style="font-size:14px; font-weight:700; margin-bottom:14px;">담당자 추가</div>
    <input id="newStaffName" class="inp" placeholder="이름" style="margin-bottom:8px;">
    <input id="newStaffPin" class="inp" placeholder="초기 비밀번호(숫자 4자리)" style="margin-bottom:14px;">
    <div style="display:flex; gap:8px;">
      <button id="cancelAddStaff" class="btn btn-outline" style="flex:1;">취소</button>
      <button id="confirmAddStaff" class="btn btn-accent" style="flex:1;">추가</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDocs, setDoc, updateDoc, onSnapshot, writeBatch
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCUMmPdmIWf1cWeseCfVrx2kewauonSijI",
  authDomain: "tucorp-93a17.firebaseapp.com",
  projectId: "tucorp-93a17",
  storageBucket: "tucorp-93a17.firebasestorage.app",
  messagingSenderId: "732272963693",
  appId: "1:732272963693:web:bae32168bfd9726de30f64",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ---------- state ----------
let staffList = [];
let cycles = [];
let items = [];
let entries = {};
let staffCycleStatus = {};
let currentTab = "ALL";
let me = null;
let displayCycles = [];
let startCycleOverride = null;
let hideWeight = false;
let columnFilters = {};   // key -> Set(allowed values) ; absent = all
let colWidths = {};       // key -> px width (user-resized)
let activeFilterKey = null;

const FROZEN_COLS = [
  { key: "gubun", label: "구분", w: 60 },
  { key: "customer", label: "고객사", w: 110 },
  { key: "staff", label: "담당자", w: 65 },
  { key: "jong", label: "지종", w: 75 },
  { key: "pyeong", label: "평량", w: 55 },
  { key: "garo", label: "가로", w: 55 },
  { key: "sero", label: "세로", w: 55 },
  { key: "pack", label: "포장", w: 65 },
  { key: "note", label: "비고", w: 110 },
];
const FILTERABLE_KEYS = ["gubun", "customer", "staff", "jong", "pyeong", "garo", "sero", "pack"];

function withLefts(cols) {
  let left = 0;
  return cols.map(c => { const w = colWidths[c.key] ?? c.w; const withLeft = { ...c, w, left }; left += w; return withLeft; });
}

function cycleSortKey(label) { return label.split("-").map(n => parseInt(n, 10)); }
function cmpCycle(a, b) {
  const ka = cycleSortKey(a.label), kb = cycleSortKey(b.label);
  for (let i = 0; i < 3; i++) { if (ka[i] !== kb[i]) return ka[i] - kb[i]; }
  return 0;
}

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ---------- login ----------
async function loadStaffForLogin() {
  const snap = await getDocs(collection(db, "hd_staff"));
  staffList = snap.docs.map(d => d.data()).sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
  const sel = document.getElementById("loginStaff");
  sel.innerHTML = staffList.filter(s => s.id !== "st_unassigned").map(s => `<option value="${s.id}">${s.name}</option>`).join("");
}

document.getElementById("loginBtn").onclick = async () => {
  const staffId = document.getElementById("loginStaff").value;
  const pin = document.getElementById("loginPin").value.trim();
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";
  const staffDoc = staffList.find(s => s.id === staffId);
  if (!staffDoc) { errEl.textContent = "담당자를 찾을 수 없습니다."; return; }
  if (String(staffDoc.pin) !== pin) { errEl.textContent = "비밀번호가 올바르지 않습니다."; return; }
  me = { id: staffDoc.id, name: staffDoc.name };
  sessionStorage.setItem("hd_me", JSON.stringify(me));
  startApp();
};

document.getElementById("logoutBtn").onclick = () => {
  sessionStorage.removeItem("hd_me");
  location.reload();
};

// ---------- realtime subscriptions ----------
function subscribeAll() {
  onSnapshot(collection(db, "hd_staff"), (snap) => {
    staffList = snap.docs.map(d => d.data()).sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
    renderNavBar();
  });
  onSnapshot(collection(db, "hd_cycles"), (snap) => {
    cycles = snap.docs.map(d => d.data()).sort(cmpCycle);
    computeDisplayCycles();
    renderNavBar();
    render();
  });
  onSnapshot(collection(db, "hd_items"), (snap) => {
    items = snap.docs.map(d => d.data());
    render();
  });
  onSnapshot(collection(db, "hd_entries"), (snap) => {
    entries = {};
    snap.docs.forEach(d => { entries[d.id] = d.data(); });
    render();
  });
  onSnapshot(collection(db, "hd_staffCycleStatus"), (snap) => {
    staffCycleStatus = {};
    snap.docs.forEach(d => { staffCycleStatus[d.id] = d.data(); });
    renderNavBar();
  });
}

function computeDisplayCycles() {
  const confirmed = cycles.filter(c => c.status === "confirmed").sort(cmpCycle);
  const open = cycles.filter(c => c.status === "open").sort(cmpCycle);
  let selected;
  if (startCycleOverride) {
    selected = confirmed.filter(c => cmpCycle({ label: c.label }, { label: startCycleOverride }) >= 0);
    if (selected.length === 0) selected = confirmed.slice(-5);
  } else {
    selected = confirmed.slice(-5);
  }
  displayCycles = [...selected, ...open.slice(-1)];
}

function currentOpenCycle() {
  const open = cycles.filter(c => c.status === "open").sort(cmpCycle);
  return open[open.length - 1] || null;
}

// ---------- unified nav bar (tabs + 담당자 마감현황, one row) ----------
function renderNavBar() {
  const bar = document.getElementById("navBar");
  const oc = currentOpenCycle();
  const staffTabs = staffList.filter(s => s.id !== "st_unassigned");
  const allActive = currentTab === "ALL";
  let html = `<div class="navpill ${allActive ? "active" : ""}" data-tab="ALL">전체</div>`;
  html += staffTabs.map(s => {
    const active = currentTab === s.name;
    const st = oc ? staffCycleStatus[`${oc.id}_${s.id}`] : null;
    const status = st ? st.status : "마감전";
    const dot = status === "마감완료" ? "#1a7f37" : status === "마감중" ? "#b45309" : "#9aa1ab";
    return `<div class="navpill ${active ? "active" : ""}" data-tab="${s.name}">
      <span class="dot" style="background:${dot};"></span>${s.name}<span class="navstatus">${status}</span>
    </div>`;
  }).join("");
  html += `<div class="navpill addpill" id="addStaffPill">+ 담당자 추가</div>`;
  bar.innerHTML = html;
  bar.querySelectorAll(".navpill[data-tab]").forEach(el => {
    el.onclick = () => { currentTab = el.dataset.tab; renderNavBar(); render(); };
  });
  const addPill = document.getElementById("addStaffPill");
  if (addPill) addPill.onclick = () => document.getElementById("addStaffModalBg").classList.remove("hidden");
}

document.getElementById("cancelAddStaff").onclick = () => document.getElementById("addStaffModalBg").classList.add("hidden");
document.getElementById("confirmAddStaff").onclick = async () => {
  const name = document.getElementById("newStaffName").value.trim();
  const pin = document.getElementById("newStaffPin").value.trim();
  if (!name || !pin) { toast("이름과 비밀번호를 입력하세요"); return; }
  const id = "st_" + Date.now();
  const order = (staffList.reduce((m, s) => Math.max(m, s.order ?? 0), 0)) + 1;
  await setDoc(doc(db, "hd_staff", id), { id, name, pin, order, active: true });
  document.getElementById("addStaffModalBg").classList.add("hidden");
  document.getElementById("newStaffName").value = "";
  document.getElementById("newStaffPin").value = "";
  toast(`"${name}" 담당자가 추가되었습니다`);
};

// ---------- close cycle (전체 탭) ----------
document.getElementById("closeCycleBtn").onclick = async () => {
  const oc = currentOpenCycle();
  if (!oc) { toast("진행 중인 차수가 없습니다"); return; }
  if (!confirm(`${oc.label} 차수를 마감 처리하시겠습니까? 마감 후에는 해당 차수가 확정 처리되고, 다음 차수가 새로 열립니다.`)) return;
  await updateDoc(doc(db, "hd_cycles", oc.id), { status: "confirmed", overallStatus: "마감완료" });
  const parts = oc.label.split("-").map(n => parseInt(n, 10));
  parts[2] += 1;
  const nextLabel = parts.join("-");
  const prevDeadline = oc.deadline ? new Date(oc.deadline) : new Date();
  const nextDeadline = new Date(prevDeadline.getTime() + 7 * 86400000);
  await setDoc(doc(db, "hd_cycles", nextLabel), {
    id: nextLabel, label: nextLabel, status: "open",
    deadline: nextDeadline.toISOString().slice(0, 10), overallStatus: "마감전",
  });
  toast(`${oc.label} 마감 완료, ${nextLabel} 차수가 열렸습니다`);
};

// ---------- staff: 마감완료 처리 ----------
async function staffCloseCurrentCycle() {
  const oc = currentOpenCycle();
  const staffDoc = staffList.find(s => s.name === currentTab);
  if (!oc || !staffDoc) return;
  const id = `${oc.id}_${staffDoc.id}`;
  await setDoc(doc(db, "hd_staffCycleStatus", id), {
    cycleId: oc.id, staffId: staffDoc.id, status: "마감완료", closedAt: new Date().toISOString(),
  });
  toast("마감 완료 처리되었습니다");
}

// ---------- weight calc ----------
function calcWeight(item, qty) {
  const g = Number(item.garo) || 0, i = Number(item.sero) || 0, p = Number(item.pyeong) || 0, q = Number(qty) || 0;
  return Math.round(p * g * i * 500 / 1000000000 * q);
}

async function writeEntryQty(itemId, cycleId, qty, item) {
  const id = `${itemId}_${cycleId}`;
  const weight = calcWeight(item, qty);
  await setDoc(doc(db, "hd_entries", id), {
    id, itemId, cycleId, qtyTotal: Number(qty) || 0, weightTotal: weight,
  }, { merge: true });
}

// ---------- new item (single row, 담당자 탭) ----------
document.getElementById("addItemBtn").onclick = async () => {
  const staffDoc = staffList.find(s => s.name === currentTab);
  if (!staffDoc) return;
  const jong = document.getElementById("ni-jong").value.trim();
  const pyeong = document.getElementById("ni-pyeong").value;
  if (!jong || !pyeong) { toast("지종과 평량은 필수입니다"); return; }
  const id = "it_" + Date.now();
  await setDoc(doc(db, "hd_items", id), {
    id,
    gubun: document.getElementById("ni-gubun").value.trim(),
    customer: document.getElementById("ni-customer").value.trim(),
    staff: staffDoc.name,
    jong,
    pyeong: Number(pyeong) || pyeong,
    garo: Number(document.getElementById("ni-garo").value) || null,
    sero: Number(document.getElementById("ni-sero").value) || null,
    pack: document.getElementById("ni-pack").value,
    note: document.getElementById("ni-note").value.trim(),
    demand: document.getElementById("ni-demand").value,
  });
  ["ni-gubun","ni-customer","ni-jong","ni-pyeong","ni-garo","ni-sero","ni-pack","ni-note","ni-demand"].forEach(elId => {
    document.getElementById(elId).value = "";
  });
  toast("품목이 추가되었습니다");
};

// ---------- confirm-file upload & matching ----------
document.getElementById("uploadConfirmBtn").onclick = () => document.getElementById("confirmFileInput").click();
document.getElementById("confirmFileInput").onchange = async (e) => {
  const files = Array.from(e.target.files || []);
  if (files.length === 0) return;
  const oc = currentOpenCycle();
  if (!oc) { toast("진행 중인 차수가 없습니다"); return; }
  let totalMatched = 0, totalUnmatched = 0;
  for (const file of files) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
    for (const r of rows) {
      const 반영여부 = String(r["반영여부"] ?? "").trim();
      const 원발주처 = String(r["원발주처"] ?? "").trim();
      if (!["승인", "반영"].includes(반영여부)) continue;
      if (!원발주처.includes("더울림")) continue;
      let jong = String(r["지종"] ?? "").trim().replace(/^Hi-Q\s*/i, "");
      const pyeong = parseInt(r["평량"], 10);
      const garo = parseInt(r["가로"], 10);
      const sero = parseInt(r["세로"], 10) || 0;
      const packRaw = String(r["포장"] ?? "").toUpperCase();
      const qty = Number(r["수량"]) || 0;
      const match = items.find(it => {
        if (String(it.jong || "").trim() !== jong) return false;
        if (parseInt(it.pyeong, 10) !== pyeong) return false;
        if (parseInt(it.garo, 10) !== garo) return false;
        if ((parseInt(it.sero, 10) || 0) !== sero) return false;
        const itPack = String(it.pack || "").toUpperCase();
        if (packRaw.includes("ROLL") && itPack !== "ROLL") return false;
        if (packRaw.includes("SKID") && itPack !== "SKID") return false;
        if (packRaw.includes("REAM") && itPack !== "REAM") return false;
        return true;
      });
      if (!match) { totalUnmatched++; continue; }
      const weight = calcWeight(match, qty);
      const id = `${match.id}_${oc.id}`;
      const existing = entries[id] || {};
      const mismatch = Math.abs(weight - (existing.weightTotal || 0)) >= 3000;
      await setDoc(doc(db, "hd_entries", id), {
        id, itemId: match.id, cycleId: oc.id,
        confirmedQty: qty, confirmedWeight: weight, mismatch,
      }, { merge: true });
      totalMatched++;
    }
  }
  toast(`매칭 완료: ${totalMatched}건, 매칭 실패: ${totalUnmatched}건`);
  e.target.value = "";
};

// ---------- column filter popup ----------
function closeFilterPopup() {
  const p = document.getElementById("filterPopup");
  if (p) p.remove();
}
document.addEventListener("click", (e) => {
  const p = document.getElementById("filterPopup");
  if (p && !p.contains(e.target) && !e.target.classList.contains("filterIcon")) {
    closeFilterPopup();
    activeFilterKey = null;
  }
});
function openFilterPopup(key, label, anchorEl) {
  closeFilterPopup();
  activeFilterKey = key;
  const uniq = Array.from(new Set(items.map(it => String(it[key] ?? "")))).filter(v => v !== "").sort();
  const selected = columnFilters[key];
  const rect = anchorEl.getBoundingClientRect();
  const pop = document.createElement("div");
  pop.id = "filterPopup";
  pop.style.cssText = `position:fixed; top:${rect.bottom + 4}px; left:${rect.left}px; background:#fff; border:1px solid #d7dbe0; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.15); padding:10px; z-index:300; max-height:260px; overflow:auto; font-size:12px; min-width:150px;`;
  pop.innerHTML = `<div style="font-weight:600; margin-bottom:6px;">${label} 필터</div>` +
    `<label style="display:block; margin-bottom:4px;"><input type="checkbox" id="filterAllChk" ${!selected ? "checked" : ""}> 전체</label>` +
    uniq.map(v => `<label style="display:block; margin-bottom:2px;"><input type="checkbox" class="fchk" value="${v}" ${(!selected || selected.has(v)) ? "checked" : ""}> ${v}</label>`).join("");
  document.body.appendChild(pop);
  pop.querySelector("#filterAllChk").onclick = (e) => {
    e.stopPropagation();
    if (e.target.checked) delete columnFilters[key];
    else columnFilters[key] = new Set();
    render();
  };
  pop.querySelectorAll(".fchk").forEach(chk => {
    chk.onclick = (e) => {
      e.stopPropagation();
      let set = columnFilters[key] ? new Set(columnFilters[key]) : new Set(uniq);
      if (chk.checked) set.add(chk.value); else set.delete(chk.value);
      if (set.size === uniq.length) delete columnFilters[key]; else columnFilters[key] = set;
      render();
    };
  });
  pop.onclick = (e) => e.stopPropagation();
}

// ---------- resizers ----------
function attachResizers(container) {
  container.querySelectorAll(".resizer").forEach(rz => {
    rz.addEventListener("mousedown", (e) => {
      e.preventDefault(); e.stopPropagation();
      const key = rz.dataset.key;
      const startX = e.clientX;
      const startW = colWidths[key] ?? Number(rz.dataset.defaultw);
      function onMove(ev) {
        const newW = Math.max(30, startW + (ev.clientX - startX));
        colWidths[key] = newW;
        container.querySelectorAll(`[data-colkey="${key}"]`).forEach(el => {
          el.style.width = newW + "px"; el.style.minWidth = newW + "px"; el.style.maxWidth = newW + "px";
        });
        updateFrozenLefts(container);
      }
      function onUp() { document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  });
}
function updateFrozenLefts(container) {
  let left = 0;
  FROZEN_COLS.forEach(c => {
    const w = colWidths[c.key] ?? c.w;
    container.querySelectorAll(`[data-colkey="${c.key}"]`).forEach(el => { el.style.left = left + "px"; });
    left += w;
  });
}

// ---------- render ----------
function render() {
  if (!me) return;
  document.getElementById("subtitle").textContent = currentTab === "ALL" ? "전체 탭" : `${currentTab} 담당자 페이지`;
  document.getElementById("allTopBar").style.display = currentTab === "ALL" ? "flex" : "none";
  document.getElementById("newItemPanel").style.display = currentTab === "ALL" ? "none" : "block";

  const container = document.getElementById("tablecontainer");
  const search = document.getElementById("searchBox").value.trim().toLowerCase();
  const tokens = search.split(/\s+/).filter(Boolean);

  let rows = items.filter(it => currentTab === "ALL" ? true : it.staff === currentTab);
  rows = rows.filter(it => FILTERABLE_KEYS.every(k => !columnFilters[k] || columnFilters[k].has(String(it[k] ?? ""))));
  if (tokens.length) {
    rows = rows.filter(it => {
      const hay = [it.gubun, it.customer, it.staff, it.jong, it.pyeong, it.garo, it.sero, it.pack, it.note, `${it.garo}x${it.sero}`]
        .map(v => String(v ?? "").toLowerCase()).join(" ");
      return tokens.every(t => hay.includes(t));
    });
  }
  document.getElementById("rowCount").textContent = `전체 ${items.filter(it => currentTab === "ALL" ? true : it.staff === currentTab).length}개 중 ${rows.length}개 표시`;

  buildTable(container, rows, { editable: currentTab !== "ALL" });
  attachResizers(container);
  if (activeFilterKey) {
    const anchor = container.querySelector(`[data-filterkey="${activeFilterKey}"]`);
    if (anchor) openFilterPopup(activeFilterKey, anchor.dataset.filterlabel, anchor);
  }

  if (currentTab !== "ALL") {
    const staffCloseBtn = document.getElementById("staffCloseBtn");
    if (staffCloseBtn) staffCloseBtn.onclick = staffCloseCurrentCycle;
  }
}

function buildTable(container, rows, opts) {
  const editable = !!opts.editable;
  const oc = currentOpenCycle();
  const frozenCols = withLefts(FROZEN_COLS);

  const frozenHead = frozenCols.map(c => {
    const filterable = FILTERABLE_KEYS.includes(c.key);
    const filterIcon = filterable ? `<span class="filterIcon" data-key="${c.key}">⏷</span>` : "";
    return `<th class="hcell frozen relhdr" data-colkey="${c.key}" ${filterable ? `data-filterkey="${c.key}" data-filterlabel="${c.label}"` : ""} rowspan="2" style="left:${c.left}px; width:${c.w}px; min-width:${c.w}px; max-width:${c.w}px;">${c.label}${filterIcon}<div class="resizer" data-key="${c.key}" data-defaultw="${c.w}"></div></th>`;
  }).join("");

  const shadeColors = ["#eef1f5", "#e3e7ee"];
  const head1 = displayCycles.map((c, idx) => {
    const isOpen = c.status === "open";
    const bg = isOpen ? "#fff7e6" : shadeColors[idx % 2];
    const dcolor = isOpen ? "#b45309" : "#8a8f98";
    const tag = isOpen ? "(의뢰)" : "(확정)";
    const colspan = hideWeight ? 1 : 2;
    return `<th class="grpcell" colspan="${colspan}" style="background:${bg}; border-left:2px solid #b9bfc7;">${c.label} ${tag}<br><span style="font-size:9px; color:${dcolor};">마감${isOpen ? "예정" : ""} ${c.deadline || ""}</span></th>`;
  }).join("");

  const head2 = displayCycles.map((c, idx) => {
    const isOpen = c.status === "open";
    const shade = isOpen ? "#fff7e6" : shadeColors[idx % 2];
    const qtyKey = `qty_${c.id}`, wKey = `weight_${c.id}`;
    const qtyW = colWidths[qtyKey] ?? 70, wW = colWidths[wKey] ?? 70;
    let h = `<th class="hcell num relhdr" data-colkey="${qtyKey}" style="background:${shade}; width:${qtyW}px; min-width:${qtyW}px; max-width:${qtyW}px; border-left:2px solid #b9bfc7;">수량<div class="resizer" data-key="${qtyKey}" data-defaultw="70"></div></th>`;
    if (!hideWeight) {
      h += `<th class="hcell num relhdr" data-colkey="${wKey}" style="background:${shade}; width:${wW}px; min-width:${wW}px; max-width:${wW}px;">중량<div class="resizer" data-key="${wKey}" data-defaultw="70"></div></th>`;
    }
    return h;
  }).join("");

  const bodyRows = rows.map(it => {
    const frozenCells = frozenCols.map(c => {
      const val = it[c.key] ?? "";
      const colorStyle = c.key === "note" ? "color:#8a8f98;" : "";
      return `<td class="cell frozen" data-colkey="${c.key}" style="left:${c.left}px; width:${c.w}px; min-width:${c.w}px; max-width:${c.w}px; ${colorStyle}">${val}</td>`;
    }).join("");
    const cells = displayCycles.map((c, idx) => {
      const isOpen = c.status === "open";
      const e = entries[`${it.id}_${c.id}`] || {};
      const shade = isOpen ? "#fffdf5" : (shadeColors[idx % 2] === "#e3e7ee" ? "#fafbfc" : "#ffffff");
      const mismatchBg = e.mismatch ? "background:#fdecea;" : `background:${shade};`;
      const qtyKey = `qty_${c.id}`, wKey = `weight_${c.id}`;
      const qtyW = colWidths[qtyKey] ?? 70, wW = colWidths[wKey] ?? 70;

      let qtyCellInner;
      if (editable && isOpen) {
        qtyCellInner = `<input class="inp qty-input" data-item="${it.id}" type="number" style="padding:2px 5px; text-align:right; border:1px solid #d7dbe0;" value="${e.qtyTotal ?? ""}">`;
      } else {
        const qty = isOpen ? (e.qtyTotal ?? "") : (e.confirmedQty ?? e.qtyTotal ?? "—");
        qtyCellInner = fmt(qty);
      }
      let cellsHtml = `<td class="cell num" data-colkey="${qtyKey}" style="width:${qtyW}px; min-width:${qtyW}px; max-width:${qtyW}px; border-left:2px solid #b9bfc7; ${mismatchBg}">${qtyCellInner}</td>`;
      if (!hideWeight) {
        const weight = isOpen ? (e.weightTotal ?? "") : (e.confirmedWeight ?? e.weightTotal ?? "—");
        cellsHtml += `<td class="cell num" data-colkey="${wKey}" style="width:${wW}px; min-width:${wW}px; max-width:${wW}px; color:#8a8f98; ${mismatchBg}">${fmt(weight)}</td>`;
      }
      return cellsHtml;
    }).join("");
    return `<tr>${frozenCells}${cells}</tr>`;
  }).join("");

  const staffBar = editable ? `
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
      <span class="badge" style="background:#fdf2e9; color:#b45309;">이번 차수 ${oc ? `${oc.label} · 마감예정 ${oc.deadline||"-"}` : "진행 중인 차수 없음"}</span>
      <button id="staffCloseBtn" class="btn btn-accent">🔒 마감완료 처리</button>
    </div>` : "";

  container.innerHTML = `
    ${staffBar}
    <table>
      <thead>
        <tr>${frozenHead}${head1}</tr>
        <tr>${head2}</tr>
      </thead>
      <tbody>${bodyRows}</tbody>
    </table>`;

  // second header row must stick BELOW the first header row, not on top of it
  const theadRows = container.querySelectorAll("thead tr");
  if (theadRows.length === 2) {
    const row1Height = theadRows[0].getBoundingClientRect().height;
    theadRows[1].querySelectorAll("th").forEach(th => { th.style.top = row1Height + "px"; });
  }

  container.querySelectorAll(".filterIcon").forEach(icon => {
    icon.onclick = (e) => {
      e.stopPropagation();
      const key = icon.dataset.key;
      const th = icon.closest("th");
      openFilterPopup(key, th.dataset.filterlabel, th);
    };
  });

  if (editable) {
    container.querySelectorAll(".qty-input").forEach(inp => {
      inp.addEventListener("change", async () => {
        const itemId = inp.dataset.item;
        const item = items.find(i => i.id === itemId);
        if (!oc || !item) return;
        await writeEntryQty(itemId, oc.id, inp.value, item);
      });
    });
  }
}

function fmt(v) {
  if (v === "" || v === undefined || v === null) return "";
  if (v === "—") return "—";
  const n = Number(v);
  if (Number.isNaN(n)) return v;
  if (n === 0) return "";
  return Math.round(n).toLocaleString();
}

document.getElementById("searchBox").oninput = render;
document.getElementById("hideWeightChk").onchange = (e) => { hideWeight = e.target.checked; render(); };
document.getElementById("startCycleApply").onclick = () => {
  startCycleOverride = document.getElementById("startCycleInput").value.trim() || null;
  computeDisplayCycles();
  render();
};
document.getElementById("startCycleReset").onclick = () => {
  startCycleOverride = null;
  document.getElementById("startCycleInput").value = "";
  computeDisplayCycles();
  render();
};

// ---------- boot ----------
async function startApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("whoami").textContent = `${me.name}님`;
  subscribeAll();
}

(async function boot() {
  await loadStaffForLogin();
  const saved = sessionStorage.getItem("hd_me");
  if (saved) { me = JSON.parse(saved); startApp(); }
})();
</script>
